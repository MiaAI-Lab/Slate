[package]
name = "slate"
version = "1.0.21"
edition = "2021"
description = "A fast, local-first Windows markdown editor built with Tauri 2, Svelte 5, and CodeMirror 6"
authors = ["MD Editor"]

[lib]
name = "slate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "fs"] }
anyhow = "1"
walkdir = "2"
notify = "7"
dashmap = "6"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }
tauri-plugin-single-instance = "2"
winreg = "0.55"
